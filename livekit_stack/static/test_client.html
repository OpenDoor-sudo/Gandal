<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventuno Q - Socratic WebRTC Console</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- LiveKit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
        }

        .container {
            width: 90%;
            max-width: 680px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        0 0 50px rgba(99, 102, 241, 0.05);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .connection-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .form-group input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-accent);
        }

        .action-button {
            background: var(--primary-accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s, background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .action-button:hover {
            background-color: #4f46e5;
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.6);
        }

        .action-button:active {
            transform: scale(0.98);
        }

        .action-button.connected {
            background: #ef4444;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .action-button.connected:hover {
            background-color: #dc2626;
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.5);
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .status-dot.active {
            background-color: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }

        .console-log {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            height: 200px;
            padding: 16px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            color: #a7f3d0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-entry {
            line-height: 1.4;
            word-break: break-all;
        }

        .log-time {
            color: #6b7280;
            margin-right: 8px;
        }

        .visualizer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px;
            gap: 4px;
        }

        .bar {
            width: 6px;
            height: 10px;
            background-color: var(--primary-accent);
            border-radius: 3px;
            transition: height 0.05s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Ventuno Q - WebRTC Console</h1>
            <p>Direct low-latency Socratic audio agent connection via LiveKit</p>
        </div>

        <div class="connection-panel">
            <div class="form-group">
                <label for="ws-url">LiveKit Server URL</label>
                <input type="text" id="ws-url" value="ws://localhost:7880" placeholder="ws://localhost:7880">
            </div>
            
            <button id="connect-btn" class="action-button">
                <span>Start Audio Session</span>
            </button>

            <div class="status-bar">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">Disconnected</span>
            </div>
        </div>

        <div class="visualizer-container" id="visualizer">
            <!-- Bars will be generated dynamically -->
        </div>

        <div class="console-log" id="console">
            <div class="log-entry"><span class="log-time">[System]</span>Ready to connect. Click "Start Audio Session".</div>
        </div>
    </div>

    <!-- Main Logic Script -->
    <script src="test_client.js"></script>
</body>
</html>
